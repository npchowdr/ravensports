<!DOCTYPE html>
<meta charset="utf-8">
<style>
  label{
    /* font: 4px sans-serif; */
    font-size: 0.250em;
  }
</style>
<body>

<script src="http://d3js.org/d3.v7.js"></script>
<!-- Create a div where the graph will take place -->
<div id="my_dataviz"></div>
<script>

var data_arr;
var curr_stat1 = "points";
var curr_stat2 = "assists";

var season_year = "2021-22"
base_api_url = "http://127.0.0.1:8000/api/get_players_stats_for_season_list/"

var stat_array_y_axis = ["points", "assists", "rebounds", "steals", "blocks"]; //name has to match name in model
var stat_array_x_axis = ["assists", "points", "rebounds", "steals", "blocks"]; //name has to match name in model

let get_season_list = () => {
  curr_year = new Date().getFullYear()
  year = 1996
  suffix = 97

  years = []
  while(year < curr_year){
    year_string = String(year).concat("-", String(suffix).slice(-2))
    console.log(year_string)
    years.push(year_string)
    year++
    suffix++
  }

  return years.reverse()
} 

var select_stat1 = d3.select('body')
  .append('select')
  	.attr('class','select')
    .on('change',onChangeStat1)

var options1 = select_stat1
  .selectAll('option')
	.data(stat_array_y_axis).enter()
	.append('option')
		.text(function (d) { return d; });

function onChangeStat1() {
	curr_stat1 = d3.select('select').property('value')

  // remove old graph
  var s = d3.selectAll('svg');
  s.remove()  

  render(data_arr, curr_stat1, curr_stat2)
};

var select_stat2 = d3.select('body')
  .append('select')
  	.attr('class','select')
    .on('change',onChangeStat2)

var options2 = select_stat2
  .selectAll('option')
	.data(stat_array_x_axis).enter()
	.append('option')
		.text(function (d) { return d; });

function onChangeStat2() {
  selections = d3.selectAll('select').nodes()
  second_select = selections[1]
	curr_stat2 = second_select.value //get value from second select node

  // remove old graph
  var s = d3.selectAll('svg');
  s.remove()  

  render(data_arr, curr_stat1, curr_stat2)
};

var select_stat3 = d3.select('body')
  .append('select')
  	.attr('class','select')
    .on('change',onChangeStat3)

var options3 = select_stat3
  .selectAll('option')
	.data(get_season_list).enter()
	.append('option')
		.text(function (d) { return d; });

function onChangeStat3() {
  selections = d3.selectAll('select').nodes()
  second_select = selections[2]
	season_year = second_select.value //get value from second select node
  season_url = base_api_url + season_year
  console.log
  //api_url(season_year)

  // remove old graph
  var s = d3.selectAll('svg');
  s.remove()  

  fetch_and_render_data(season_url)
  //render(data_arr, curr_stat1, curr_stat2)
};

const render = (data, stat1, stat2) => {

  const title =  stat1 + ' VS ' + stat2 + ' ' + season_year

  var margin = {top: 20, right: 20, bottom: 50, left: 50},
    width = 960 - margin.left - margin.right,
    height = 500 - margin.top - margin.bottom;

  // append the svg object to the body of the page
  var svg = d3.select("#my_dataviz")
    .append("svg")
      .attr("width", width + margin.left + margin.right)
      .attr("height", height + margin.top + margin.bottom)
    .append("g")
      .attr("transform",
            "translate(" + margin.left + "," + margin.top + ")");

  var svg = d3.select("body").append("svg")
      .attr("width", width + margin.left + margin.right)
      .attr("height", height + margin.top + margin.bottom)
    .append("g")
      .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

  const xValue = d => d[stat2];
  const yValue = d => d[stat1];

  // Add X axis
    var xScale = d3.scaleLinear()
        //.domain(d3.extent(data, xValue))
        .domain([0, d3.max(data, d => d[stat2]) + 30])
        .range([0, width]);
    svg.append("g")
        .attr("transform", "translate(0," + height + ")")
        .call(d3.axisBottom(xScale).tickFormat(d3.format("d"))); //tick format to remove comma from year

    // Add Y axis
    var yScale = d3.scaleLinear()
        .domain([0, d3.max(data, d => d[stat1]) + 2])
        .range([ height, 0]);
    svg.append("g")
        .call(d3.axisLeft(yScale));

    // Add dots
    svg.append('g')
        .selectAll("circle")
        .data(data)
        .enter()
        .append("circle")
        .attr("cx", d => xScale(xValue(d)))
        .attr("cy", d => yScale(yValue(d)))
        .attr("r", 5)
        .style("fill", "#000000")
 
    // Add label for dots
    data.forEach ( d => {
      svg.append("text")
      .attr('class', 'label')
      .attr('x', xScale(xValue(d))-25)
      .attr('y', yScale(yValue(d))+20)
      .text(d['playerId'].playerFirstName + " " + d['playerId'].playerLastName);
    })
   
    // Add Graph title
    svg.append('text')
      .attr('class', 'title')
      .attr('y', -5)
      .attr('x', width/2)
      .text(title);
}

function fetch_and_render_data(url){
  d3.json(url).then(function(data){
    data_arr = data.regular_season_totals
    console.log(data_arr)

    render(data_arr, curr_stat1, curr_stat2);
  });
}

fetch_and_render_data(base_api_url+"2021-22")


</script>
</body>
</html>
