<!DOCTYPE html>
<meta charset="utf-8">
<style>
  .label{
    font: 10px sans-serif;
  }
</style>
<body>

<h1 id="player_header">{{ player }}</h1>

<form class="d-flex" method=POST action="{% url 'scatter_graph' %}">
  {% csrf_token %}
  <input type="search" placeholder="Search for Player" aria-label="Search" name="searched">
  <button type="submit">Search</button>
</form>

<script src="http://d3js.org/d3.v7.js"></script>
<!-- Create a div where the graph will take place -->
<div id="my_dataviz"></div>
<script>

var data_arr;
var curr_stat1 = "points";
var curr_stat2 = "season";

var player_name = document.getElementById('player_header').innerHTML;
api_url = "api/get_player_regular_season_totals_stats_list/" + player_name.replace(" ", "%20")

var stat_array_y_axis = ["points", "assists", "rebounds", "steals", "blocks"]; //name has to match name in model
var stat_array_x_axis = ["season", "points", "assists", "rebounds", "steals", "blocks"];

var select_stat1 = d3.select('body')
  .append('select')
  	.attr('class','select')
    .on('change',onChangeStat1)

var options1 = select_stat1
  .selectAll('option')
	.data(stat_array_y_axis).enter()
	.append('option')
		.text(function (d) { return d; });

function onChangeStat1() {
	curr_stat1 = d3.select('select').property('value')

  // remove old graph
  var s = d3.selectAll('svg');
  s.remove()  

  render(data_arr, curr_stat1, curr_stat2)
};

var select_stat2 = d3.select('body')
  .append('select')
  	.attr('class','select')
    .on('change',onChangeStat2)

var options2 = select_stat2
  .selectAll('option')
	.data(stat_array_x_axis).enter()
	.append('option')
		.text(function (d) { return d; });

function onChangeStat2() {
  selections = d3.selectAll('select').nodes()
  second_select = selections[1]
	curr_stat2 = second_select.value //get value from second select node

  // remove old graph
  var s = d3.selectAll('svg');
  s.remove()  

  render(data_arr, curr_stat1, curr_stat2)
};

const render = (data, stat1, stat2) => {

  const title = player_name + ' ' + stat1 + ' VS ' + stat2

  var margin = {top: 20, right: 20, bottom: 50, left: 50},
    width = 960 - margin.left - margin.right,
    height = 500 - margin.top - margin.bottom;

  // append the svg object to the body of the page
  var svg = d3.select("#my_dataviz")
    .append("svg")
      .attr("width", width + margin.left + margin.right)
      .attr("height", height + margin.top + margin.bottom)
    .append("g")
      .attr("transform",
            "translate(" + margin.left + "," + margin.top + ")");

  var svg = d3.select("body").append("svg")
      .attr("width", width + margin.left + margin.right)
      .attr("height", height + margin.top + margin.bottom)
    .append("g")
      .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

  const xValue = d => d[stat2];
  const yValue = d => d[stat1];

  // Add X axis
  if(stat2 == "season"){
    var xScale = d3.scaleBand()
                  .domain(data.map(xValue))
                  .range([0, width])

    svg.append("g")
        .attr("transform", "translate(0," + height + ")")
        .call(d3.axisBottom(xScale));
      
  } else {
    var xScale = d3.scaleLinear()
        //.domain(d3.extent(data, xValue))
        .domain([0, d3.max(data, d => d[stat2]) + 2])
        .range([0, width]);
    svg.append("g")
        .attr("transform", "translate(0," + height + ")")
        .call(d3.axisBottom(xScale).tickFormat(d3.format("d")));
  }

    // Add Y axis
    var yScale = d3.scaleLinear()
        .domain([0, d3.max(data, d => d[stat1]) + 2])
        .range([ height, 0]);
    svg.append("g")
        .call(d3.axisLeft(yScale));

    // Add dots
    if(stat2 == "season"){
      svg.append('g')
        .selectAll("circle")
        .data(data)
        .enter()
        .append("circle")
        .attr("cx", d => xScale(xValue(d)) + xScale.bandwidth()/2)
        .attr("cy", d => yScale(yValue(d)))
        .attr("r", 5)
        .style("fill", "#000000")

    } else {
      svg.append('g')
        .selectAll("circle")
        .data(data)
        .enter()
        .append("circle")
        .attr("cx", d => xScale(xValue(d)))
        .attr("cy", d => yScale(yValue(d)))
        .attr("r", 5)
        .style("fill", "#000000")
    }
    
 
    // Add label for dots
    if(stat2 == "season"){
      data.forEach ( d => {
        svg.append("text")
        .attr('class', 'label')
        .attr('x', xScale(xValue(d)) + (xScale.bandwidth()/2) - 30)
        .attr('y', yScale(yValue(d))+20)

        .text(xValue(d) + ", " + yValue(d));
      })
    } else {
      data.forEach ( d => {
        svg.append("text")
        .attr('class', 'label')
        .attr('x', xScale(xValue(d))-25)
        .attr('y', yScale(yValue(d))+20)

        .text(xValue(d) + ", " + yValue(d) + ", " + d.season);
      })
    }
   
    // Add Graph title
    svg.append('text')
      .attr('class', 'title')
      .attr('y', -10)
      .attr('x', width/2)
      .text(title);
}

d3.json(api_url).then(function(data){
  data_arr = data.player_per_game_stats
  console.log(data_arr)

  // data_arr = "{{stat_list}}";
  // console.log(data_arr)

  render(data_arr, curr_stat1, curr_stat2); //AD PPG by year default    
});



</script>
</body>
</html>
